name: Native build123d checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: python -m pip install -r cad/requirements.txt
      - run: python -m unittest discover -s tests -p test_native_parameters.py
      - run: python -m cad.export --output build/native-16x9
      - run: python -m cad.export --aspect 2 --output build/native-2x1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-processor-parts
          path: |
            build/native-*/parameters.json
            build/native-*/model-report.json
            build/native-*/assembly.step
            build/native-*/plates
