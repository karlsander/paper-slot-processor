name: Geometry and build checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Check and bundle local viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare OpenSCAD 2026-10-12 with Manifold
        run: |
          docker pull openscad/openscad@sha256:4098a7c2c37d5a9110121635a568e6596b8619362ced5c84cc67f47d395e7fd0
          cat > "$RUNNER_TEMP/openscad" <<'SH'
          #!/bin/sh
          exec docker run --rm --user "$(id -u):$(id -g)" \
            -e QT_QPA_PLATFORM=offscreen \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            openscad/openscad@sha256:4098a7c2c37d5a9110121635a568e6596b8619362ced5c84cc67f47d395e7fd0 openscad "$@"
          SH
          chmod +x "$RUNNER_TEMP/openscad"
          echo "OPENSCAD_BIN=$RUNNER_TEMP/openscad" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_geometry.py
      - run: python scripts/check_v2.py
      - run: python scripts/check_v1_8.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: geometry-checks
          path: |
            build/geometry-checks
            build/v2-checks
            build/v1.8-checks
