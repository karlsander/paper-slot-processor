name: Durst native CAD and FreeCAD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  durst-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: python -m pip install -r cad/requirements.txt
      - run: python -m unittest discover -s tests -p test_durst_c35.py
      - name: Install Ubuntu FreeCAD console
        run: |
          sudo apt-get update
          sudo apt-get install -y freecad
          echo "FREECAD_CMD=$(command -v freecadcmd || command -v FreeCADCmd)" >> "$GITHUB_ENV"
      - run: python scripts/check_durst_geometry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: durst-c35-native
          path: build/durst-c35-native
