name: Durst insertion-area CAD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: python -m pip install -r cad/requirements.txt
      - run: python -m unittest discover -s tests -p test_durst_interface.py
      - name: Install independent FreeCAD geometry kernel
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y freecad
      - name: Import, check, save and reopen native fixture
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          FREECAD_BIN=$(command -v freecadcmd || command -v FreeCADCmd)
          python scripts/check_durst_interface.py --freecad "$FREECAD_BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: durst-insertion-area-reference
          path: build/durst-c35-interface/
