name: Native enlarger holder
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  enlarger:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: python -m pip install -r cad/requirements.txt
      - run: python -m unittest discover -s tests -p test_enlarger.py
      - name: Install independent FreeCAD kernel
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y freecad
      - name: Validate native plates, fits, exposure and FreeCAD documents
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          FREECAD_BIN=$(command -v freecadcmd || command -v FreeCADCmd)
          python scripts/check_enlarger.py --freecad "$FREECAD_BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-enlarger
          path: build/enlarger-native/
